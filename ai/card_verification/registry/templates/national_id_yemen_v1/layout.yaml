template_id: national_id_yemen_v1
display_name: "Yemen National ID - v1 (Photo left, Emblem top-center, Blue stamp under photo)"
template_version: "1.0.0"

card_aspect_ratio: 1.585

rectification:
  method: contour_quad
  output_size:
    width: 1000
    height: 631
  min_area_ratio: 0.12
  max_skew_deg: 18
  confidence_min: 0.6

template_matching:
  primary_anchor: emblem
  min_match_score: 0.45
  multi_scale:
    enabled: true
    scales: [0.85, 0.9, 0.95, 1.0, 1.05, 1.1]

elements:
  emblem:
    required: true
    roi:
      x: 0.38243
      y: 0.037007
      w: 0.211468
      h: 0.185
    verification:
      type: classical
      method: template_match
      refs:
        - refs/emblem.png
    position_tolerance:
      dx: 0.03
      dy: 0.03
      scale: 0.1

  photo:
    required: true
    roi:
      x: 0.041557
      y: 0.04523
      w: 0.32667
      h: 0.427632
    verification:
      type: layout-only
    position_tolerance:
      dx: 0.03
      dy: 0.03
      scale: 0.1

  name_text:
    required: true
    roi:
      x: 0.161667
      y: 0.576271
      w: 0.471667
      h: 0.095176
    verification:
      type: layout-only
    position_tolerance:
      dx: 0.03
      dy: 0.03
      scale: 0.1

  national_id_number:
    required: true
    roi:
      x: 0.398333
      y: 0.466754
      w: 0.319167
      h: 0.087353
    verification:
      type: layout-only
    position_tolerance:
      dx: 0.03
      dy: 0.03
      scale: 0.1

  stamp_under_photo_band:
    required: false
    roi:
      x: 0.043609
      y: 0.450059
      w: 0.104511
      h: 0.130435
    verification:
      type: layout-only
    constraints:
      must_be_under: photo

  stamp_expected:
    required: false
    roi:
      x: 0.046667
      y: 0.457627
      w: 0.084167
      h: 0.11734
    verification:
      type: layout-only
    position_tolerance:
      dx: 0.04
      dy: 0.04
      scale: 0.15
    constraints:
      must_be_under: photo

thresholds:
  emblem_template_match:
    min_score: 0.45
    strong_score: 0.6

decisions:
  codes:
    NOT_A_CARD: "Card not detected/rectified"
    UNKNOWN_TEMPLATE: "No template matched"
    LAYOUT_MISMATCH: "Layout constraints failed"
    OK: "Template matched, layout ok, emblem ok, stamp under photo ok"

debug:
  save_overlays: true
  overlay_rois:
    - emblem
    - photo
    - name_text
    - national_id_number
    - stamp_under_photo_band
    - stamp_expected
  save_masks: true
  save_rectified: true
