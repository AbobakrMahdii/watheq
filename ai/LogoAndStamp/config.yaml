# Wathiq Configuration
# وثيق - National ID Logo Verification Pipeline

# ==== PATHS ====
paths:
  reference_logo: "data/reference/reference_logo.png"
  model_checkpoint: "models/logo_resnet50.pt"
  output_dir: "output/"
  generation_log: "data/generation_log.json"
  
  # Stamp paths
  reference_stamp: "data/reference/reference_stamp.png"
  stamp_model_checkpoint: "models/stamp_resnet50.pt"

# ==== ROI CROPPING ====
# Ratios relative to image dimensions (top-center logo region)
roi:
  x_start_ratio: 0.35   # Start at 35% from left
  x_end_ratio: 0.65     # End at 65% from left
  y_start_ratio: 0.0    # Start at top
  y_end_ratio: 0.20     # End at 20% from top

# Ratios relative to image dimensions (bottom-center stamp region)
stamp_roi:
  x_start_ratio: 0.35   # Center-ish
  x_end_ratio: 0.65
  y_start_ratio: 0.75   # Bottom region
  y_end_ratio: 1.0

# ==== IMAGE PREPROCESSING ====
preprocessing:
  target_size: [224, 224]
  use_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]

# ==== VERIFICATION THRESHOLDS ====
# Calibrate using validation set ROC curves
thresholds:
  ssim:
    strong_genuine: 0.90
    suspicious: 0.70
  orb:
    strong_genuine: 0.35
    suspicious: 0.15
    min_good_matches: 10
  resnet:
    strong_genuine: 0.80
    suspicious: 0.50

# Optimized for security (conservative)
stamp_thresholds:
  ssim:
    strong_genuine: 0.85   # Lower than logo due to ink variations
    suspicious: 0.65
  orb:
    strong_genuine: 0.25
    suspicious: 0.10
    min_good_matches: 8
  siamese:
    strong_genuine: 0.80   # One-shot similarity
    suspicious: 0.60
  resnet:
    strong_genuine: 0.85   # Hardened for stamp
    suspicious: 0.50

# ==== TRAINING HYPERPARAMETERS ====
training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.01
  dropout: 0.5
  early_stopping_patience: 10
  freeze_backbone: true
  unfreeze_last_block: true
  num_workers: 4

# ==== DATASET GENERATION ====
dataset:
  genuine_count: 600
  forged_count: 600
  train_ratio: 0.8
  # Distribution per level (forged only)
  level_distribution:
    obvious: 0.33      # Level 1
    subtle: 0.33       # Level 2
    near_authentic: 0.34  # Level 3 (hard negatives)
  random_seed: 42

# Robustness settings
stamp_verification:
  jitter:
    h_range: 0.08    # ±8% horizontal search
    v_range: 0.05    # ±5% vertical search
    h_step: 0.02     # 2% increments
    v_step: 0.01     # 1% increments
  siamese:
    input_size: [224, 224]
    feature_dim: 2048
