[pytest]
# Pytest configuration for Watheq API tests

# Ensure project root is on sys.path so 'from ai.models...' works
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = api/tests ai/tests

# Output options
addopts = 
    -v
    --tb=short
    -p no:cacheprovider

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Custom markers
markers =
    unit: unit tests
    slow: slow-running tests

#Coverage options
[coverage:run]
source = api
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_db: Tests that require database
    requires_docker: Tests that require Docker containers (IPFS, MultiChain)
