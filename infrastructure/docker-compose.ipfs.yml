services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-node
    restart: unless-stopped

    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"

    volumes:
      - ipfs-data:/data/ipfs

    environment:
      IPFS_PROFILE: server

    command: ["daemon", "--migrate=true"]

volumes:
  ipfs-data:
